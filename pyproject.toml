[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autovisor"
version = "3.17.3"
description = "智慧树课程自动化工具"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-python~=4.10.0.82",
    "numpy~=1.26.4",
    "pyinstaller~=6.20.0",
    "playwright~=1.59.0",
    "PyGetWindow~=0.0.9; platform_system == 'Windows'",
    "requests~=2.33.1",
    "Pillow~=10.1.0",
    "httpx~=0.28.1",
]

[tool.setuptools]
py-modules = []
